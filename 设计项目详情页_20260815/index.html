<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计项目｜江佳佳作品集</title>
  <meta name="description" content="江佳佳的城市与景观设计项目详情：封面简介与图纸浏览。">
  <link rel="stylesheet" href="../styles.css?v=20260815-02">
  <style>
    .project-page { max-width: 1248px; margin: 0 auto; padding: 132px var(--side, 24px) 96px; }
    .project-crumb { width: 46px; height: 46px; margin-bottom: 40px; }
    .project-crumb svg { width: 22px; height: 22px; }
    .project-hero { padding: 40px; background: var(--white); border: var(--border); box-shadow: 8px 8px 0 var(--ink); }
    .project-meta-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .project-meta-row span { padding: 5px 12px; border: 2px solid var(--ink); font: 700 12px/18px var(--mono); letter-spacing: .5px; }
    .project-meta-row .meta-code { background: var(--yellow); }
    .project-meta-row .meta-year { background: var(--white); }
    .project-meta-row .meta-loc { background: var(--blue); }
    .project-title { margin: 26px 0 0; font: 900 clamp(38px, 5.5vw, 56px)/1.15 var(--display); }
    .project-title mark { padding: 0 10px; background: var(--yellow); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .project-subtitle { margin: 12px 0 0; color: var(--blue-dark); font: 700 16px/24px var(--mono); }
    .project-desc { max-width: 860px; margin: 26px 0 0; font: 500 17px/30px var(--sans); }
    .project-viewer { margin-top: 56px; }
    .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .viewer-head h2 { margin: 0; font: 900 26px/34px var(--display); }
    .viewer-head h2 mark { padding: 2px 10px; background: var(--pink, #ff90e8); }
    .viewer-tools { display: flex; align-items: center; gap: 14px; }
    .viewer-count { min-width: 72px; padding: 6px 10px; border: 2px solid var(--ink); background: var(--white); font: 700 13px/18px var(--mono); text-align: center; }
    .viewer-stage { position: relative; border: var(--border); background: #111; box-shadow: 8px 8px 0 var(--ink); }
    .viewer-frame { position: relative; aspect-ratio: 1190 / 842; }
    .viewer-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
    .viewer-nav { position: absolute; top: 50%; z-index: 2; width: 52px; height: 52px; display: grid; place-items: center; transform: translateY(-50%); color: var(--ink); background: var(--yellow); border: var(--border); box-shadow: 4px 4px 0 var(--ink); font: 900 22px/1 var(--display); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .viewer-nav:hover { transform: translateY(-50%) translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .viewer-nav:active { transform: translateY(-50%) translate(2px, 2px); box-shadow: none; }
    .viewer-nav:disabled { opacity: .35; cursor: default; }
    .viewer-nav:disabled:hover { transform: translateY(-50%); box-shadow: 4px 4px 0 var(--ink); }
    .viewer-prev { left: -18px; }
    .viewer-next { right: -18px; }
    .viewer-hint { margin: 16px 0 0; color: rgba(17, 17, 17, .6); font: 500 13px/20px var(--sans); }
    .project-nav-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 64px; }
    .project-nav-row a { flex: 1; display: flex; align-items: center; gap: 10px; padding: 16px 20px; color: var(--ink); background: var(--white); border: var(--border); box-shadow: var(--shadow-small); font: 800 14px/20px var(--sans); text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
    .project-nav-row a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .project-nav-row a.next { justify-content: flex-end; text-align: right; }
    .project-nav-row a[hidden] { visibility: hidden; }
    @media (max-width: 820px) {
      .project-page { padding-top: 108px; }
      .project-hero { padding: 24px; }
      .project-desc { font-size: 15px; line-height: 26px; }
      .viewer-head { flex-wrap: wrap; }
      .viewer-prev { left: 8px; }
      .viewer-next { right: 8px; }
      .viewer-nav { width: 44px; height: 44px; }
      .project-nav-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header" data-header>
    <nav class="nav-shell" aria-label="主导航">
      <a class="nav-brand" href="../index.html" aria-label="返回首页">首页</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">菜单</button>
      <div class="nav-links" id="nav-links">
        <a href="../index.html#about">关于我</a>
        <a href="../index.html#products">产品</a>
        <a href="../index.html#content">内容</a>
        <a href="../index.html#thesis">设计</a>
        <a href="../index.html#contact">联系</a>
      </div>
    </nav>
  </header>

  <main class="project-page">
    <a class="project-crumb icon-button" href="../index.html#thesis" aria-label="返回设计作品集" title="返回设计作品集">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M19 12H6"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>

    <section class="project-hero">
      <div class="project-meta-row">
        <span class="meta-code" id="p-code"></span>
        <span class="meta-year" id="p-year"></span>
        <span class="meta-loc" id="p-loc"></span>
      </div>
      <h1 class="project-title"><mark id="p-title"></mark></h1>
      <p class="project-subtitle" id="p-subtitle"></p>
      <p class="project-desc" id="p-desc"></p>
    </section>

    <section class="project-viewer">
      <div class="viewer-head">
        <h2><mark>项目图纸</mark></h2>
        <div class="viewer-tools">
          <a class="icon-button" id="p-pdf" href="#" target="_blank" rel="noopener noreferrer" hidden aria-label="打开完整 PDF" title="打开完整 PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9.5 13h5M9.5 17h5"/></svg>
          </a>
          <span class="viewer-count" id="p-count">1 / 1</span>
        </div>
      </div>
      <div class="viewer-stage">
        <div class="viewer-frame">
          <img id="p-image" src="" alt="项目图纸">
        </div>
        <button class="viewer-nav viewer-prev" id="p-prev" type="button" aria-label="上一页">←</button>
        <button class="viewer-nav viewer-next" id="p-next" type="button" aria-label="下一页">→</button>
      </div>
    </section>

    <div class="project-nav-row">
      <a id="p-nav-prev" href="#">← <span></span></a>
      <a id="p-nav-next" class="next" href="#"><span></span> →</a>
    </div>
  </main>

  <dialog class="practice-lightbox" id="practice-lightbox" aria-labelledby="practice-lightbox-title">
    <div class="practice-lightbox-shell">
      <header class="practice-lightbox-header">
        <div>
          <p>项目图纸</p>
          <h2 id="practice-lightbox-title">图纸放大</h2>
        </div>
        <div class="practice-lightbox-tools">
          <span class="practice-lightbox-count" aria-live="polite">1 / 1</span>
          <button class="practice-lightbox-close" type="button" aria-label="关闭图纸">×</button>
        </div>
      </header>
      <div class="practice-lightbox-stage">
        <button class="practice-lightbox-zoom" type="button" aria-label="放大当前图纸" aria-pressed="false">
          <img class="practice-lightbox-image" src="" alt="项目图纸放大">
        </button>
      </div>
      <button class="practice-lightbox-nav practice-lightbox-prev" type="button" aria-label="上一页">←</button>
      <button class="practice-lightbox-nav practice-lightbox-next" type="button" aria-label="下一页">→</button>
    </div>
  </dialog>

  <script src="project.js?v=20260815-03" defer></script>
</body>
</html>
